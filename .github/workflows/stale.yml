---
name: stale
on:
  workflow_dispatch:
  schedule:
    - cron: 30 1 * * *  # every day at 1:30am UTC

permissions:
  pull-requests: write
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          # PRs
          stale-pr-message: |
            Labelling this PR stale because no activity for 30 days.
            Remove stale label or add a comment to prevent this PR from closing in 10 days.
          close-pr-message: |
            This PR was closed because there was no activity for 10 days after labelling stale.
          days-before-pr-stale: 30
          days-before-pr-close: 10
          stale-pr-label: stale
          exempt-pr-labels: security,security-vulnerability,security-feature
          operations-per-run: 100

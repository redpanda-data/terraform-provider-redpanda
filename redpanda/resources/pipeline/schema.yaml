message: "Pipeline represents a Redpanda Connect pipeline"
api_schema: Pipeline
tf_name: Pipeline

timeouts: [create, update, delete]

api:
  update:
    # The resource builds the UpdatePipelineRequest itself around the plan
    # payload and a FieldMask of the changed fields. Without a mask the
    # dataplane replaces every mutable field, and a payload that omits
    # service_account (the provider never holds the write-only client_secret)
    # clears it. The payload stays whole so it passes request validation
    # that does not consult the mask, as the mock server's does.
    return_payload: true
    diff_mask: full

id:
  computed_only: true

display_name:
  required: true
  validator: "StringLengthAtLeast{n: 1}"

description:
  optional: true
  computed: false

config_yaml:
  required: true
  sensitive: true

resources:
  optional: true
  computed: true
  # API canonicalizes memory_shares/cpu_shares (e.g. echoes "1200M" when the
  # user wrote "256Mi"). Without flatten_from_prev, state drifts on every plan
  # because the proto echo disagrees with the user's input. The directive
  # restores the user's planned value over the canonicalized echo. Nested
  # write_only and extra fields auto-preserve from prev without any directive.
  flatten_from_prev: true
  fields:
    memory_shares:
      optional: true
      validator: MemorySharesValidator
      skip_proto_validation: true
    cpu_shares:
      optional: true
      validator: CPUSharesValidator
      skip_proto_validation: true

tags:
  optional: true
  computed: false

service_account:
  optional: true
  computed: false
  plan_modifiers: [UseStateForUnknown]
  fields:
    client_id:
      required: true
    client_secret:
      required: true
      write_only: true
      flatten_skip: true
    secret_version:
      extra: true
      type: int64
      optional: true
      plan_modifiers: [UseStateForUnknown]

state:
  optional: true
  computed: true
  validator: "OneOf{values: |running|stopped}"
  flatten_via: FlattenDesiredState
  # No default: an omitted state follows the pipeline, so a start or stop made
  # outside Terraform is not drift.
  # Reconciled in place via Start/Stop RPCs, not the PipelineUpdate payload.
  updatable_out_of_band: true

status:
  computed_only: true
  fields:
    error:
      computed_only: true

url:
  computed_only: true

cluster_api_url:
  extra: true
  type: string
  required: true
  plan_modifiers: [RequiresReplace]
allow_deletion:
  extra: true
  type: bool
  optional: true
  computed: true
  default: false

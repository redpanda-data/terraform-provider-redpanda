message: "Network represents a Redpanda Cloud managed network"
api_schema: Network
tf_name: Network
timeouts: [create, update, delete]

api:
  update:
    # Resource code diffs plan against prev state into a sparse NetworkUpdate
    # and wraps it in the request itself. The only leaf the control plane
    # accepts on this path is customer_managed_resources.aws.public_subnets;
    # egress_spec is also on the update shape but stays RequiresReplace until
    # in-place egress changes are verified against the data plane.
    return_payload: true
    diff_mask: sparse

name:
  required: true
  plan_modifiers: [RequiresReplace]

cidr_block:
  optional: true
  computed: false
  plan_modifiers: [RequiresReplace]
  validator: CIDRBlock
  flatten_via: cidrBlockFromProto

region:
  required: true
  plan_modifiers: [RequiresReplace]

cloud_provider:
  required: true
  plan_modifiers: [RequiresReplace]
  validator: CloudProviders

resource_group_id:
  required: true
  plan_modifiers: [RequiresReplace]

cluster_type:
  required: true
  plan_modifiers: [RequiresReplace]
  validator: ClusterTypes

customer_managed_resources:
  optional: true
  computed: false
  fields:
    # RequiresReplace sits on the leaves: the update mask is applied per leaf,
    # which is where the generator checks coverage against the update shape.
    aws:
      optional: true
      fields:
        management_bucket:
          required: true
          fields:
            arn:
              required: true
              plan_modifiers: [RequiresReplace]
        dynamodb_table:
          required: true
          fields:
            arn:
              required: true
              plan_modifiers: [RequiresReplace]
        vpc:
          required: true
          fields:
            arn:
              required: true
              plan_modifiers: [RequiresReplace]
        private_subnets:
          required: true
          fields:
            arns:
              required: true
              plan_modifiers: [RequiresReplace]
        # Write-once on the control plane: settable on a network that has none,
        # never changed or cleared afterwards. The modifier in plan_modifiers.go
        # carries the rule; the fake mirrors it on UpdateNetwork.
        public_subnets:
          optional: true
          computed: true
          plan_modifiers: [PublicSubnetsWriteOnce]
          fields:
            arns:
              required: true
    gcp:
      optional: true
      computed: false
      fields:
        network_name:
          required: true
          plan_modifiers: [RequiresReplace]
          validator:
            - GCPResourceName
            - "LengthAtMost{n: 62}"
        network_project_id:
          required: true
          plan_modifiers: [RequiresReplace]
          validator:
            - GCPResourceName
            - "LengthAtMost{n: 30}"
        management_bucket:
          required: true
          fields:
            name:
              required: true
              plan_modifiers: [RequiresReplace]

    azure:
      todo: true
# Response-only fields (present on Network but not NetworkCreate). The
# per-RPC payload-type divergence pass skips these automatically when
# emitting the Create expander — no extra wiring needed.

id:
  computed_only: true

state:
  computed_only: true

zones:
  computed_only: true


# --- New proto fields (auto-added by schemagen -todo) ---
egress_spec:
  optional: true
  computed: false
  fields:
    aws:
      optional: true
      computed: false
      plan_modifiers: [RequiresReplace]
      fields:
        transit_gateway_id:
          required: true
          validator: TransitGatewayID
    gcp:
      optional: true
      computed: false
      plan_modifiers: [RequiresReplace]
      fields:
        hub_vpc_project:
          required: true
          validator:
            - GCPResourceName
            - "LengthAtMost{n: 30}"
        hub_vpc_name:
          required: true
          validator:
            - GCPResourceName
            - "LengthAtMost{n: 63}"
    azure:
      optional: true
      computed: false
      plan_modifiers: [RequiresReplace]
      fields:
        hub_vnet_id:
          required: true
        firewall_private_ip:
          required: true
          validator: IPAddress
cloud_provider_access_id:
  todo: true

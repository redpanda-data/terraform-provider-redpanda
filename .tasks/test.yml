version: '3'

vars:
  REDPANDA_CLIENT_ID: '{{.REDPANDA_CLIENT_ID | default ""}}'
  REDPANDA_CLIENT_SECRET: '{{.REDPANDA_CLIENT_SECRET | default ""}}'
  REDPANDA_CLOUD_ENVIRONMENT: '{{.REDPANDA_CLOUD_ENVIRONMENT | default "pre"}}'
  CLUSTER_ID: '{{.CLUSTER_ID | default ""}}'
  TF_LOG: '{{.TF_LOG | default "WARN"}}'
  TIMEOUT: '{{.TIMEOUT | default "6h"}}'
  TIMEOUT_SHORT: '{{.TIMEOUT_SHORT | default "1h"}}'
  VERSION: '{{.VERSION | default "pre"}}'

# Passed through the environment rather than interpolated into command
# bodies: Task echoes command bodies, which put the secret in CI logs.
env:
  REDPANDA_CLIENT_ID: '{{.REDPANDA_CLIENT_ID}}'
  REDPANDA_CLIENT_SECRET: '{{.REDPANDA_CLIENT_SECRET}}'
  # The provider-upgrade entry's released provider binary reads the cloud
  # environment ONLY from the process environment and defaults to prod;
  # without this export, pre-env credentials hit the prod auth domain.
  REDPANDA_CLOUD_ENVIRONMENT: '{{.REDPANDA_CLOUD_ENVIRONMENT}}'
  # One provider plugin cache per run, so the released provider the upgrade
  # entry fetches is downloaded once instead of once per test working dir.
  # The generated config only tunes caching; the entry's guard rejects any
  # config that redirects provider installation.
  TF_CLI_CONFIG_FILE:
    sh: ./scripts/acc-plugin-cache.sh "{{.BUILD_ROOT}}"

tasks:
  unit:
    desc: "Run unit tests"
    deps:
      - :tools:install:go
      - :tools:install:terraform
    cmds:
      - echo "Running unit tests..."
      - |
        DEBUG=true \
        REDPANDA_CLIENT_ID="dummy_id" \
        REDPANDA_CLIENT_SECRET="dummy_secret" \
        TF_ACC_TERRAFORM_PATH="{{.BUILD_ROOT}}/bin/terraform" \
        {{.PATH_PREFIX}} go test -race -short -timeout 10m ./...
      - echo "Unit tests completed successfully"

  integration:
    desc: "Run integration tests"
    deps:
      - :tools:install:go
      - :tools:install:terraform
    cmds:
      - echo "Running integration tests..."
      - |
        DEBUG=true \
        REDPANDA_CLIENT_ID="dummy_id" \
        REDPANDA_CLIENT_SECRET="dummy_secret" \
        TF_ACC_TERRAFORM_PATH="{{.BUILD_ROOT}}/bin/terraform" \
        {{.PATH_PREFIX}} go test -race -count=1 -tags=integration -timeout 15m -run '^TestIntegration_' ./...
      - echo "Integration tests completed successfully"

  network:
    desc: "Run network resource tests"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running network live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,network -v -timeout={{.TIMEOUT_SHORT}} \
          ./redpanda/resources/network/...
      - echo "Network tests completed successfully"

  service_account:
    desc: "Run service account live-acc tests (control-plane only, no cluster needed)"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running service account live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,service_account -v -timeout={{.TIMEOUT_SHORT}} \
          ./redpanda/resources/serviceaccount/...
      - echo "Service account tests completed successfully"

  shadowlink:
    desc: "Run shadow link acceptance test (provisions two dedicated AWS clusters + link)"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running shadow link live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,shadowlink -v -timeout={{.TIMEOUT}} \
          ./redpanda/resources/shadowlink/...
      - echo "Shadow link tests completed successfully"

  datasource:cluster:
    desc: "Run cluster datasource acceptance test (creates cluster + reads via datasource)"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running cluster datasource live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,datasource_cluster -v -timeout={{.TIMEOUT}} \
          ./redpanda/resources/cluster/...
      - echo "Cluster datasource tests completed successfully"

  cluster:aws:
    desc: "Run AWS cluster acceptance tests"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running AWS cluster live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,cluster_aws -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/ \
          ./redpanda/resources/schema/... \
          ./redpanda/resources/schemaregistryacl/... \
          ./redpanda/resources/user/...
      - echo "AWS cluster tests completed successfully"

  cluster:aws:duallisteners:
    desc: "Run the AWS dual-listener-mode cluster acceptance test (requires enable-public-private-listeners on the test org)"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running AWS dual-listener cluster live-acc test..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,cluster_aws_dual -v -timeout={{.TIMEOUT}} \
          -run TestAcc_Cluster_AWS_DualListeners \
          ./redpanda/tests/
      - echo "AWS dual-listener cluster test completed successfully"

  cluster:gcp:
    desc: "Run GCP cluster acceptance tests"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running GCP cluster live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,cluster_gcp -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "GCP cluster tests completed successfully"

  byoc:aws:
    desc: "Run AWS BYOC acceptance tests"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running AWS BYOC live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,byoc_aws -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "AWS BYOC tests completed successfully"

  byovpc:aws:
    desc: "Provision BYOVPC AWS infra and run TestAcc_Cluster_BYOVPC_AWS (PUBLIC_SUBNETS=1 adds the network public-subnets step; needs the dual-listener preview flag)"
    deps:
      - :tools:install:terraform
    vars:
      AWS_REGION: '{{.AWS_REGION | default "us-east-2"}}'
      # Off by default: registering public subnets needs the
      # enable-public-private-listeners flag on the org, and the control plane
      # rejects the step with PermissionDenied otherwise.
      PUBLIC_SUBNETS: '{{.PUBLIC_SUBNETS | default ""}}'
    cmds:
      - echo "Provisioning BYOVPC AWS test infra..."
      - |
        export PATH="{{.BUILD_ROOT}}/bin:$PATH"
        cd redpanda/tests/testdata/network/aws
        terraform init
        terraform apply -auto-approve -var "region={{.AWS_REGION}}"
      - echo "Running AWS BYOVPC live-acc tests..."
      - |
        set -euo pipefail
        INPUTS=$(cat redpanda/tests/testdata/network/aws/inputs.json)
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        AWS_REGION="{{.AWS_REGION}}" \
        AWS_ZONES="$(echo "$INPUTS" | jq -r '.zones')" \
        RP_MANAGEMENT_BUCKET_ARN="$(echo "$INPUTS" | jq -r '.management_bucket_arn')" \
        RP_DYNAMODB_TABLE_ARN="$(echo "$INPUTS" | jq -r '.dynamodb_table_arn')" \
        RP_VPC_ARN="$(echo "$INPUTS" | jq -r '.vpc_arn')" \
        RP_PRIVATE_SUBNET_ARNS="$(echo "$INPUTS" | jq -r '.private_subnet_arns')" \
        RP_PUBLIC_SUBNET_ARNS="{{if .PUBLIC_SUBNETS}}$(echo "$INPUTS" | jq -r '.public_subnet_arns'){{end}}" \
        RP_PERMISSIONS_BOUNDARY_POLICY_ARN="$(echo "$INPUTS" | jq -r '.permissions_boundary_policy_arn')" \
        RP_AGENT_INSTANCE_PROFILE_ARN="$(echo "$INPUTS" | jq -r '.agent_instance_profile_arn')" \
        RP_CONNECTORS_NODE_GROUP_INSTANCE_PROFILE_ARN="$(echo "$INPUTS" | jq -r '.connectors_node_group_instance_profile_arn')" \
        RP_UTILITY_NODE_GROUP_INSTANCE_PROFILE_ARN="$(echo "$INPUTS" | jq -r '.utility_node_group_instance_profile_arn')" \
        RP_REDPANDA_NODE_GROUP_INSTANCE_PROFILE_ARN="$(echo "$INPUTS" | jq -r '.redpanda_node_group_instance_profile_arn')" \
        RP_K8S_CLUSTER_ROLE_ARN="$(echo "$INPUTS" | jq -r '.k8s_cluster_role_arn')" \
        RP_REDPANDA_AGENT_SECURITY_GROUP_ARN="$(echo "$INPUTS" | jq -r '.redpanda_agent_security_group_arn')" \
        RP_CONNECTORS_SECURITY_GROUP_ARN="$(echo "$INPUTS" | jq -r '.connectors_security_group_arn')" \
        RP_REDPANDA_NODE_GROUP_SECURITY_GROUP_ARN="$(echo "$INPUTS" | jq -r '.redpanda_node_group_security_group_arn')" \
        RP_UTILITY_SECURITY_GROUP_ARN="$(echo "$INPUTS" | jq -r '.utility_security_group_arn')" \
        RP_CLUSTER_SECURITY_GROUP_ARN="$(echo "$INPUTS" | jq -r '.cluster_security_group_arn')" \
        RP_NODE_SECURITY_GROUP_ARN="$(echo "$INPUTS" | jq -r '.node_security_group_arn')" \
        RP_CLOUD_STORAGE_BUCKET_ARN="$(echo "$INPUTS" | jq -r '.cloud_storage_bucket_arn')" \
        RP_RPSQL_CLOUD_STORAGE_BUCKET_ARN="$(echo "$INPUTS" | jq -r '.rpsql_cloud_storage_bucket_arn')" \
        RP_RPSQL_NODE_GROUP_INSTANCE_PROFILE_ARN="$(echo "$INPUTS" | jq -r '.rpsql_node_group_instance_profile_arn')" \
        RP_RPSQL_SECURITY_GROUP_ARN="$(echo "$INPUTS" | jq -r '.rpsql_security_group_arn')" \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,byovpc_aws -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "BYOVPC AWS tests completed successfully"

  byovpc:gcp:
    desc: "Provision BYOVPC GCP infra and run TestAcc_Cluster_BYOVPC_GCP"
    deps:
      - :tools:install:terraform
    vars:
      GCP_REGION: '{{.GCP_REGION | default "us-central1"}}'
      PROJECT_ID: '{{.PROJECT_ID | default .GCP_PROJECT_ID}}'
      # 1-9 chars, non-empty: the module's operator service account is
      # "rp-op<postfix>" and underruns GCP's 6-char account_id minimum without it.
      # Per-run so concurrent builds do not collide; sweepable by prefix afterwards.
      UNIQUE_IDENTIFIER:
        sh: echo "${UNIQUE_IDENTIFIER:-${BUILDKITE_BUILD_NUMBER:-local}}"
    cmds:
      - echo "Provisioning BYOVPC GCP test infra..."
      - |
        export PATH="{{.BUILD_ROOT}}/bin:$PATH"
        cd redpanda/tests/testdata/network/gcp
        terraform init
        terraform apply -auto-approve \
          -var "project_id={{.PROJECT_ID}}" \
          -var "region={{.GCP_REGION}}" \
          -var "unique_identifier={{.UNIQUE_IDENTIFIER}}" \
          -var "google_credentials_base64=$GOOGLE_CREDENTIALS_BASE64"
      - echo "Running GCP BYOVPC live-acc tests..."
      - |
        set -euo pipefail
        INPUTS=$(cat redpanda/tests/testdata/network/gcp/inputs.json)
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        GCP_REGION="{{.GCP_REGION}}" \
        GCP_PROJECT_ID="{{.PROJECT_ID}}" \
        GCP_VPC_NETWORK_NAME="$(echo "$INPUTS" | jq -r '.network_name')" \
        GCP_SUBNET_NAME="$(echo "$INPUTS" | jq -r '.subnet_name')" \
        GCP_SECONDARY_IPV4_RANGE_PODS_NAME="$(echo "$INPUTS" | jq -r '.secondary_ipv4_range_pods_name')" \
        GCP_SECONDARY_IPV4_RANGE_SERVICES_NAME="$(echo "$INPUTS" | jq -r '.secondary_ipv4_range_services_name')" \
        GCP_K8S_MASTER_IPV4_RANGE="$(echo "$INPUTS" | jq -r '.k8s_master_ipv4_range')" \
        GCP_MANAGEMENT_BUCKET_NAME="$(echo "$INPUTS" | jq -r '.management_bucket_name')" \
        GCP_TIERED_STORAGE_BUCKET_NAME="$(echo "$INPUTS" | jq -r '.tiered_storage_bucket_name')" \
        GCP_AGENT_SERVICE_ACCOUNT_EMAIL="$(echo "$INPUTS" | jq -r '.agent_service_account_email')" \
        GCP_CONSOLE_SERVICE_ACCOUNT_EMAIL="$(echo "$INPUTS" | jq -r '.console_service_account_email')" \
        GCP_CONNECTOR_SERVICE_ACCOUNT_EMAIL="$(echo "$INPUTS" | jq -r '.connector_service_account_email')" \
        GCP_REDPANDA_CLUSTER_SERVICE_ACCOUNT_EMAIL="$(echo "$INPUTS" | jq -r '.redpanda_cluster_service_account_email')" \
        GCP_GKE_SERVICE_ACCOUNT_EMAIL="$(echo "$INPUTS" | jq -r '.gke_service_account_email')" \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,byovpc_gcp -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "BYOVPC GCP tests completed successfully"

  byovpc:azure:
    desc: "Provision BYOVNet Azure infra and run TestAcc_Cluster_BYOVPC_Azure"
    deps:
      - :tools:install:terraform
    vars:
      # Which live tests run on the provisioned infra. The default is the full
      # network-plus-cluster test alone: the existing-network variant covers a
      # subset of it, and every extra cluster costs an hour and four public IPs.
      # The :network and :cluster variants narrow to one contract each.
      BYOVPC_AZURE_PKG: '{{.BYOVPC_AZURE_PKG | default "./redpanda/tests/"}}'
      BYOVPC_AZURE_RUN: '{{.BYOVPC_AZURE_RUN | default "TestAcc_Cluster_BYOVPC_Azure$"}}'
      AZURE_REGION: '{{.AZURE_REGION | default "eastus"}}'
      # 1-5 lowercase alphanumerics: the module derives every globally unique
      # storage-account and key-vault name from it. Per-run so concurrent
      # builds do not collide and a soft-deleted vault from the last run does
      # not block this one.
      UNIQUE_IDENTIFIER:
        sh: echo "${UNIQUE_IDENTIFIER:-${BUILDKITE_BUILD_NUMBER:-local}}" | tr -cd 'a-z0-9' | cut -c1-5
    cmds:
      - echo "Checking Azure vCPU quota in {{.AZURE_REGION}}..."
      - |
        set -euo pipefail
        ./scripts/azure-quota-precheck.sh "{{.AZURE_REGION}}"
      - echo "Provisioning BYOVNet Azure test infra..."
      - |
        set -euo pipefail
        export PATH="{{.BUILD_ROOT}}/bin:$PATH"
        # The Buildkite secret carries AZURE_*; the azurerm provider reads ARM_*.
        export ARM_CLIENT_ID="${ARM_CLIENT_ID:-${AZURE_CLIENT_ID:-}}"
        export ARM_CLIENT_SECRET="${ARM_CLIENT_SECRET:-${AZURE_CLIENT_SECRET:-}}"
        export ARM_TENANT_ID="${ARM_TENANT_ID:-${AZURE_TENANT_ID:-}}"
        export ARM_SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID:-${AZURE_SUBSCRIPTION_ID:-}}"
        cd redpanda/tests/testdata/network/azure
        terraform init
        terraform apply -auto-approve \
          -var "region={{.AZURE_REGION}}" \
          -var "zones=[\"{{.AZURE_REGION}}-az1\",\"{{.AZURE_REGION}}-az2\",\"{{.AZURE_REGION}}-az3\"]" \
          -var "unique_identifier={{.UNIQUE_IDENTIFIER}}" \
          -var "subscription_id=$ARM_SUBSCRIPTION_ID" \
          -var "tenant_id=$ARM_TENANT_ID"
      - echo "Waiting for the caller's blob access on the management storage account..."
      - |
        set -euo pipefail
        export ARM_CLIENT_ID="${ARM_CLIENT_ID:-${AZURE_CLIENT_ID:-}}"
        export ARM_CLIENT_SECRET="${ARM_CLIENT_SECRET:-${AZURE_CLIENT_SECRET:-}}"
        export ARM_TENANT_ID="${ARM_TENANT_ID:-${AZURE_TENANT_ID:-}}"
        INPUTS=$(cat redpanda/tests/testdata/network/azure/inputs.json)
        ./scripts/azure-storage-access-wait.sh \
          "$(echo "$INPUTS" | jq -r '.management_bucket_storage_account_name')" \
          "$(echo "$INPUTS" | jq -r '.management_bucket_storage_container_name')"
      - echo "Running Azure BYOVNet live-acc tests..."
      - |
        set -euo pipefail
        export ARM_CLIENT_ID="${ARM_CLIENT_ID:-${AZURE_CLIENT_ID:-}}"
        export ARM_CLIENT_SECRET="${ARM_CLIENT_SECRET:-${AZURE_CLIENT_SECRET:-}}"
        export ARM_TENANT_ID="${ARM_TENANT_ID:-${AZURE_TENANT_ID:-}}"
        export ARM_SUBSCRIPTION_ID="${ARM_SUBSCRIPTION_ID:-${AZURE_SUBSCRIPTION_ID:-}}"
        INPUTS=$(cat redpanda/tests/testdata/network/azure/inputs.json)
        # Every scalar key becomes AZ_<KEY>; zones join to a comma list. jq
        # emits the exports: a process substitution never delivers under the
        # task runner's shell on macOS, and ${k^^} needs bash 4.
        eval "$(echo "$INPUTS" | jq -r 'to_entries[] | select(.value|type=="string") | "export AZ_\(.key|ascii_upcase)=\(.value|@sh)"')"
        export AZ_ZONES="$(echo "$INPUTS" | jq -r '.zones | join(",")')"
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        AZURE_REGION="{{.AZURE_REGION}}" \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,byovpc_azure -v -timeout={{.TIMEOUT}} \
          -run "{{.BYOVPC_AZURE_RUN}}" {{.BYOVPC_AZURE_PKG}}
      - echo "BYOVNet Azure tests completed successfully"

  byovpc:azure:network:
    desc: "Provision BYOVNet Azure infra and run only TestAcc_Network_BYOVPC_Azure (no cluster)"
    cmds:
      - task: byovpc:azure
        vars:
          BYOVPC_AZURE_PKG: "./redpanda/resources/network/"
          BYOVPC_AZURE_RUN: "TestAcc_Network_BYOVPC_Azure"

  byovpc:azure:cluster:
    desc: "Provision BYOVNet Azure infra and run TestAcc_Cluster_BYOVPC_Azure_ExistingNetwork (network via API, cluster via Terraform)"
    cmds:
      - task: byovpc:azure
        vars:
          BYOVPC_AZURE_RUN: "TestAcc_Cluster_BYOVPC_Azure_ExistingNetwork"

  byoc:gcp:
    desc: "Run GCP BYOC acceptance tests"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running GCP BYOC live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,byoc_gcp -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "GCP BYOC tests completed successfully"

  serverless:aws:public:
    desc: "Run serverless cluster tests (AWS, public only)"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running AWS serverless public live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,serverless_aws_public -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "Serverless cluster AWS public tests completed successfully"

  serverless:gcp:
    desc: "Run serverless cluster tests (GCP, public only)"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running GCP serverless live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,serverless_gcp -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "Serverless cluster GCP tests completed successfully"

  serverless:aws:private:
    desc: "Run serverless cluster tests (AWS, private only)"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running AWS serverless private live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,serverless_aws_private -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "Serverless cluster AWS private tests completed successfully"

  serverless:aws:both:
    desc: "Run serverless cluster tests (AWS, public and private)"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running AWS serverless both live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,serverless_aws_both -v -timeout={{.TIMEOUT}} \
          ./redpanda/tests/
      - echo "Serverless cluster AWS both tests completed successfully"

  serverless:regions:
    desc: "Run serverless regions data source tests"
    deps:
      - :tools:install:terraform
    cmds:
      - echo "Running serverless regions live-acc tests..."
      - |
        DEBUG=true \
        TF_ACC=true \
        TF_LOG={{.TF_LOG}} \
        VERSION={{.VERSION}} \
        {{.PATH_PREFIX}} go test \
          -count=1 -tags=live_test,serverless_regions -v -timeout={{.TIMEOUT}} \

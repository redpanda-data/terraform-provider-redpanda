version: '3'

# A local OIDC issuer that the Azure app registration trusts, for testing the
# byoc plugin with workload identity federation and no client secret. State,
# including the private signing key, lives in AZURE_OIDC_DIR, which is
# gitignored. With AZURE_OIDC_IDENTITY=app (the default) up and down change
# the app registration: run them as an owner of it (for example
# AZURE_CONFIG_DIR pointing at that owner's az login). With
# AZURE_OIDC_IDENTITY=managed, up creates a user-assigned managed identity
# that trusts the issuer instead, which needs only Contributor and User Access
# Administrator on the subscription; every later task uses that identity.

vars:
  AZURE_OIDC_DIR: '{{.AZURE_OIDC_DIR | default ".azure-oidc"}}'
  AZURE_OIDC_SUBJECT: '{{.AZURE_OIDC_SUBJECT | default "tfrp-oidc-manual"}}'
  AZURE_OIDC_IDENTITY: '{{.AZURE_OIDC_IDENTITY | default "app"}}'

env:
  AZURE_OIDC_DIR: '{{.AZURE_OIDC_DIR}}'
  AZURE_OIDC_SUBJECT: '{{.AZURE_OIDC_SUBJECT}}'
  AZURE_OIDC_IDENTITY: '{{.AZURE_OIDC_IDENTITY}}'

tasks:
  build:
    desc: "Build the azureoidc tool into the local OIDC state dir"
    cmds:
      - go build -o "{{.AZURE_OIDC_DIR}}/bin/azureoidc" ./cmd/azureoidc

  key:
    desc: "Generate the local RSA signing key (kept if it already exists)"
    deps: [build]
    status:
      - test -f "{{.AZURE_OIDC_DIR}}/signing-key.pem"
    cmds:
      - '"{{.AZURE_OIDC_DIR}}/bin/azureoidc" keygen -out "{{.AZURE_OIDC_DIR}}/signing-key.pem"'

  up:
    desc: "Publish the issuer to a storage account and trust it from the app registration, or from a managed identity it creates with AZURE_OIDC_IDENTITY=managed"
    deps: [key]
    cmds:
      - ./scripts/azure-oidc.sh up

  login:
    desc: "Prove Entra accepts a token from the local issuer (az login in a throwaway config dir)"
    deps: [build]
    cmds:
      - ./scripts/azure-oidc.sh login

  token:
    desc: "Mint a token to AZURE_OIDC_DIR/token; LIFETIME sets its lifetime"
    deps: [build]
    vars:
      LIFETIME: '{{.LIFETIME | default "1h"}}'
    cmds:
      - |
        set -euo pipefail
        test -f "{{.AZURE_OIDC_DIR}}/issuer" || { echo "no issuer recorded; run task azure-oidc:up" >&2; exit 1; }
        "{{.AZURE_OIDC_DIR}}/bin/azureoidc" mint \
          -key "{{.AZURE_OIDC_DIR}}/signing-key.pem" \
          -issuer "$(cat "{{.AZURE_OIDC_DIR}}/issuer")" \
          -subject "{{.AZURE_OIDC_SUBJECT}}" \
          -lifetime "{{.LIFETIME}}" \
          -out "{{.AZURE_OIDC_DIR}}/token"
        echo "{{.AZURE_OIDC_DIR}}/token"

  down:
    desc: "Delete the federated credential, the managed identity's roles and custom role, and the issuer site (the signing key is kept)"
    deps: [build]
    cmds:
      - ./scripts/azure-oidc.sh down

  plugin:build:
    desc: "Cross-build the byoc plugin from a cloudv2 checkout the way its install pack does; CLOUDV2=<path> (required), GOOS/GOARCH default linux/amd64 for the VM lane; writes AZURE_OIDC_DIR/plugin/byoc-GOOS-GOARCH for REDPANDA_BYOC_PLUGIN_PATH"
    vars:
      CLOUDV2: '{{.CLOUDV2}}'
      GOOS: '{{.GOOS | default "linux"}}'
      GOARCH: '{{.GOARCH | default "amd64"}}'
    cmds:
      - |
        set -euo pipefail
        test -n "{{.CLOUDV2}}" || { echo "set CLOUDV2 to a cloudv2 checkout" >&2; exit 1; }
        pkg="{{.CLOUDV2}}/apps/redpanda-agent/cmd/agent-bootstrap"
        test -d "$pkg" || { echo "{{.CLOUDV2}} has no apps/redpanda-agent/cmd/agent-bootstrap; is it a cloudv2 checkout?" >&2; exit 1; }
        rev="$(git -C "{{.CLOUDV2}}" rev-parse --short HEAD)"
        dirty=""; [[ -z "$(git -C "{{.CLOUDV2}}" status --porcelain)" ]] || dirty="-dirty"
        out="$(pwd)/{{.AZURE_OIDC_DIR}}/plugin/byoc-{{.GOOS}}-{{.GOARCH}}"
        mkdir -p "$(dirname "$out")"
        # The pack stamps main.Version and main.Revision; a build without them
        # reports an empty version to the control plane.
        (cd "{{.CLOUDV2}}" && GOOS={{.GOOS}} GOARCH={{.GOARCH}} CGO_ENABLED=0 go build \
          -ldflags "-X main.Version=local-$rev$dirty -X main.Revision=$rev" \
          -o "$out" ./apps/redpanda-agent/cmd/agent-bootstrap)
        echo "$out (cloudv2 $rev$dirty)"

  byoc:apply:
    desc: "Apply an Azure BYOC cluster authenticating through the local issuer; PROVIDER=local|released, AUTH=token-file|pod-file|relative-path|arm-token|customer|actions|cli-session|secret, REDPANDA_BYOC_PLUGIN_PATH to run a local plugin build"
    deps: [build]
    vars:
      PROVIDER: '{{.PROVIDER | default "local"}}'
      AUTH: '{{.AUTH | default "token-file"}}'
    cmds:
      - ./scripts/azure-oidc-byoc.sh apply "{{.PROVIDER}}" "{{.AUTH}}"

  byoc:plan:
    desc: "Plan against the cluster from azure-oidc:byoc:apply with -detailed-exitcode; same PROVIDER and AUTH"
    deps: [build]
    vars:
      PROVIDER: '{{.PROVIDER | default "local"}}'
      AUTH: '{{.AUTH | default "token-file"}}'
    cmds:
      - ./scripts/azure-oidc-byoc.sh plan "{{.PROVIDER}}" "{{.AUTH}}"

  byoc:destroy:
    desc: "Destroy the Azure BYOC cluster from azure-oidc:byoc:apply; PROVIDER=local|released, AUTH=token-file|pod-file|relative-path|arm-token|customer|actions|cli-session|secret, REDPANDA_BYOC_PLUGIN_PATH to run a local plugin build"
    deps: [build]
    vars:
      PROVIDER: '{{.PROVIDER | default "local"}}'
      AUTH: '{{.AUTH | default "token-file"}}'
    cmds:
      - ./scripts/azure-oidc-byoc.sh destroy "{{.PROVIDER}}" "{{.AUTH}}"

  vm:up:
    desc: "Create an Azure VM whose IMDS answers like a GitHub-hosted runner, SSH open to this machine only"
    cmds:
      - ./scripts/azure-oidc-vm.sh up

  vm:check:
    desc: "Confirm the VM IMDS answers Identity not found for AZURE_CLIENT_ID"
    cmds:
      - ./scripts/azure-oidc-vm.sh check

  vm:run:
    desc: "Run azure-oidc:byoc on the VM, which mints its own tokens with the copied key; ACTION=apply|plan|destroy, PROVIDER=local|released, AUTH=token-file|pod-file|relative-path|arm-token|customer|actions, REDPANDA_BYOC_PLUGIN_PATH a linux/amd64 plugin build to run, AZURE_OIDC_VM_TAG to overlap runs, AZURE_OIDC_VM_ENV for extra NAME=value pairs"
    deps: [build]
    vars:
      ACTION: '{{.ACTION | default "apply"}}'
      PROVIDER: '{{.PROVIDER | default "local"}}'
      AUTH: '{{.AUTH | default "customer"}}'
    cmds:
      - ./scripts/azure-oidc-vm.sh run "{{.ACTION}}" "{{.PROVIDER}}" "{{.AUTH}}"

  vm:wait:
    desc: "Follow the run started by azure-oidc:vm:run (same AZURE_OIDC_VM_TAG) until it finishes"
    cmds:
      - ./scripts/azure-oidc-vm.sh wait

  vm:down:
    desc: "Remove the signing key and delete the VM (refuses while any of its Terraform states holds resources unless FORCE=1)"
    cmds:
      - ./scripts/azure-oidc-vm.sh down

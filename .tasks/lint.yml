version: '3'

vars:
  CLI_ARGS: '{{.CLI_ARGS | default ""}}'
  GOLANGCI_LINT: "{{.BUILD_ROOT}}/bin/golangci-lint"

tasks:
  default:
    desc: "Run all code quality checks"
    deps:
      - :tools:install:go
      - :tools:install:golangci-lint
    cmds:
      - ./scripts/lint-comments.sh
      - echo "Running linting..."
      - |
        if [ "$BUILDKITE" = "true" ]; then
          echo "Running in BuildKite environment with buildvcs=false"
          {{.PATH_PREFIX}} GOFLAGS="-buildvcs=false" golangci-lint run --timeout=5m {{.CLI_ARGS}}
        else
          echo "Running in local environment"
          {{.PATH_PREFIX}} golangci-lint run {{.CLI_ARGS}}
        fi
      - echo "Linting completed successfully"

  fix:
    desc: "Run linting with auto-fix (license headers first: goheader's own fix writes the year regexp literally)"
    cmds:
      - ./scripts/license-headers.sh
      - task: default
        vars:
          CLI_ARGS: "--fix"

  headers:
    desc: "Insert missing license headers (current year) and normalize existing ones (year kept)"
    cmds:
      - ./scripts/license-headers.sh

  comments:
    desc: "Fail on Go comments carrying ticket/PR refs or review chatter; --report lists long blocks"
    cmds:
      - ./scripts/lint-comments.sh {{.CLI_ARGS}}
